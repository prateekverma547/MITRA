<!doctype html>
<html lang="en">
  <head>
    <script>
      // The chosen theme, before anything paints, so a page never flashes the wrong one.
      // Light unless this browser has chosen dark.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mitra.theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/mitra-mark.svg" />
    <title>MITRA Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
